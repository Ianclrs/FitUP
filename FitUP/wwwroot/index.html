<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitUP</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https://use.typekit.net; connect-src 'self' http://localhost:* https:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" />
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" sizes="32x32" href="img/logof1-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="img/logof1-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="img/logof1-512.png" />
    <link rel="apple-touch-icon" href="img/logof1-512.png" />
    <!-- PWA: manifest e theme-color para instalação na tela inicial -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FF7A2F" />
    <link href="FitUP.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <!-- Lazy loader do jsPDF (~300 KB) — carregado sob demanda apenas nas páginas de exportação -->
    <script src="js/pdfLoader.js"></script>
    <!-- helper de exportação FitUP -->
    <script src="js/pdfExport.js"></script>
</head>

<body>
    <div id="app" style="display:flex; align-items:center; justify-content:center; min-height:100vh;">
        <div class="loading-wrapper">
            <span class="loading-progress-text">Carregando...</span>
            <div class="loading-progress-container">
            <div class="loading-progress-bar"></div>
        </div>
       </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <!-- PWA: registra service worker para cache offline e instalação -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js').then(function (reg) {
                console.log('FitUP SW registered:', reg.scope);
            }).catch(function (err) {
                console.warn('FitUP SW registration failed:', err);
            });
        }
    </script>
</body>

</html>
